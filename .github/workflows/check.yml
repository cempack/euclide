name: "check"

# Lint, typecheck, test and build every branch and pull request. Never
# publishes anything. publish.yml runs it too, before releasing main or a tag.
on:
  # main and tags are checked by publish.yml, on the commit it releases.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Called from publish.yml, github.workflow is "publish": its own group, so
# neither run cancels the other.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  # Lints and tests side by side: clippy builds the dependencies' metadata
  # and the tests their code, so one after the other took twice as long
  # whenever the cache missed (up to 17 minutes on Windows).
  rust-lint:
    name: rust lint (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-22.04", "windows-latest"]
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: lint-${{ matrix.platform }}
          # A change to the CI build settings starts a fresh cache.
          key: ${{ hashFiles('.github/ci-cargo.toml') }}
          cache-on-failure: true
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      # Windows-only code (portable updater, keep-awake) only compiles here.
      # CI build settings (no debug info, plain dependencies): .github/ci-cargo.toml.
      - run: cargo clippy --all-targets --config ../.github/ci-cargo.toml -- -D warnings
      # Advisories, licences and sources of the dependencies (deny.toml). The
      # binary comes from GitHub: the action's Docker image came from Docker
      # Hub, whose limit on anonymous pulls failed the job by itself.
      - name: install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny
        if: runner.os == 'Linux'
        run: cargo deny --log-level warn --all-features check

  rust-test:
    name: rust test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-22.04", "windows-latest"]
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: test-${{ matrix.platform }}
          # A change to the CI build settings starts a fresh cache.
          key: ${{ hashFiles('.github/ci-cargo.toml') }}
          cache-on-failure: true
      - run: cargo test --config ../.github/ci-cargo.toml

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/requirements.txt
      # The sidecar's own libraries too: a test reads a PDF with pypdf.
      - run: pip install ruff -r sidecar/requirements.txt
      - run: ruff check .
      # live_pronote_demo.py needs the network and Pronote's demo server: not run here.
      - name: unit tests
        working-directory: sidecar
        run: python -m unittest discover -s tests -t .
