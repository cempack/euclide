name: "check"

# Lint, typecheck, test and build every branch and pull request. Never
# publishes anything.
on:
  # Branches only: a release tag points at a commit main already checked.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  # Lints and tests side by side: clippy builds the dependencies' metadata
  # and the tests their code, so one after the other took twice as long
  # whenever the cache missed (up to 17 minutes on Windows).
  rust-lint:
    name: rust lint (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-22.04", "windows-latest"]
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: lint-${{ matrix.platform }}
          # A change to the CI build settings starts a fresh cache.
          key: ${{ hashFiles('.github/ci-cargo.toml') }}
          cache-on-failure: true
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      # Windows-only code (portable updater, keep-awake) only compiles here.
      # CI build settings (no debug info, plain dependencies): .github/ci-cargo.toml.
      - run: cargo clippy --all-targets --config ../.github/ci-cargo.toml -- -D warnings
      # Advisories, licences and sources of the dependencies (deny.toml).
      - name: cargo deny
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml

  rust-test:
    name: rust test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-22.04", "windows-latest"]
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: test-${{ matrix.platform }}
          # A change to the CI build settings starts a fresh cache.
          key: ${{ hashFiles('.github/ci-cargo.toml') }}
          cache-on-failure: true
      - run: cargo test --config ../.github/ci-cargo.toml

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      # live_pronote_demo.py needs the network and Pronote's demo server: not run here.
      - name: unit tests
        working-directory: sidecar
        run: python -m unittest discover -s tests -t .
