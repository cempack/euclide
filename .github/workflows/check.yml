name: "check"

# Lint, typecheck, test and build every branch and pull request. Never
# publishes anything.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-22.04", "windows-latest"]
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6
      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: check-${{ matrix.platform }}
          cache-on-failure: true
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      # Windows-only code (portable updater, keep-awake) only compiles here.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Advisories, licences and sources of the dependencies (deny.toml).
      - name: cargo deny
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      # live_pronote_demo.py needs the network and Pronote's demo server: not run here.
      - name: unit tests
        working-directory: sidecar
        run: python -m unittest discover -s tests -t .
