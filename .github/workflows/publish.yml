name: "publish"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish a GitHub release. Merges into main (when app/packaging source changed) cut the next v* tag. Version tags and manual runs also publish Latest."
        required: false
        default: true
        type: boolean

# The version job drafts the GitHub release; every matrix leg uploads into it
# (tauri-action merges latest.json); windows-portable-manifest makes it public
# once complete.
permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Skip the matrix on main when the push is docs/CI-only. Tags and manual
  # runs always publish. Do not use workflow-level paths-ignore: that would
  # also filter v* tag pushes.
  should-publish:
    name: Should rebuild portables
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out() { echo "run=$1" >> "$GITHUB_OUTPUT"; echo "should-publish=$1"; }

          if [ "$EVENT_NAME" != "push" ] || [[ "$REF" == refs/tags/* ]]; then
            out true
            exit 0
          fi

          if [ -z "${BEFORE:-}" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            out true
            exit 0
          fi

          msg="$(git log -1 --format=%s "$SHA" 2>/dev/null || true)"
          if [[ "$msg" == "chore: release v"* ]]; then
            echo "Version bump commit; skip rebuild."
            out false
            exit 0
          fi

          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE" || { out true; exit 0; }
          fi

          if ! changed="$(git diff --name-only "$BEFORE" "$SHA")"; then
            echo "git diff failed; publish to be safe."
            out true
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$changed"

          if [ -z "$changed" ]; then
            echo "No files changed; skip rebuild."
            out false
            exit 0
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/*|src-tauri/*|sidecar/*|scripts/*|public/*)
                echo "Code change: $f"
                out true
                exit 0
                ;;
              package.json|package-lock.json|index.html|vite.config.ts|tailwind.config.js|postcss.config.js|tsconfig.json|tsconfig.node.json)
                echo "Code change: $f"
                out true
                exit 0
                ;;
            esac
          done <<< "$changed"

          echo "No app/packaging source changes; skip rebuild."
          out false

  # Lint, typecheck and tests of the commit about to be released: a red main
  # never reaches the teacher.
  check:
    needs: should-publish
    if: needs.should-publish.outputs.run == 'true'
    uses: ./.github/workflows/check.yml

  version:
    name: Next v* release
    needs: [should-publish, check]
    if: needs.should-publish.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
      version: ${{ steps.cut.outputs.version }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'main' }}

      - name: Cut version tag
        id: cut
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          git fetch origin main
          gh release delete dev-build --yes --repo "${{ github.repository }}" || true
          git push origin :refs/tags/dev-build || true

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Using existing $TAG"
            exit 0
          fi

          # check passed for this run's commit only. When main has moved on
          # since, the run of the newer push releases everything.
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on since $GITHUB_SHA: the newer run releases it."
            exit 0
          fi

          git config user.name "Elliot Moreau"
          git config user.email "73651345+cempack@users.noreply.github.com"
          git checkout -B main origin/main

          VERSION="$(python3 scripts/set-release-version.py --next)"
          python3 scripts/set-release-version.py --set "$VERSION"
          TAG="v$VERSION"

          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore: release $TAG" -m "[skip ci]"
          git tag "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # One draft for every leg to upload into (legs creating it themselves
      # could make one each). /releases/latest, which every copy reads,
      # keeps serving the previous release until this one is complete.
      - name: Draft the release
        id: draft
        if: steps.cut.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cut.outputs.tag }}
          REPO: ${{ github.repository }}
          BODY: |
            Installateurs et archives USB portables.

            L’application vérifie `latest.json` sur GitHub Releases. Windows portable met à jour `Euclide-windows-portable.zip` **dans le dossier courant** (Euclide-Data intact). Les copies NSIS utilisent l’installateur.
        run: |
          set -euo pipefail
          # Drafts are only found in the list, not by tag.
          ids="$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          id="${ids%%$'\n'*}"
          if [ -z "$id" ]; then
            id="$(gh api "repos/$REPO/releases" -f tag_name="$TAG" -f name="Euclide $TAG" -f body="$BODY" -F draft=true --jq .id)"
            echo "Drafted release $id for $TAG"
          else
            echo "Release $id already exists for $TAG"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: [should-publish, version]
    if: needs.should-publish.outputs.run == 'true' && needs.version.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (aarch64) - standard .app (no dmg setup)
            target: "aarch64-apple-darwin"
            arch: "aarch64"
            args: "--target aarch64-apple-darwin --bundles app"
          - platform: "ubuntu-22.04" # Linux - portable AppImage (no deb/rpm setups)
            target: "x86_64-unknown-linux-gnu"
            arch: "x86_64"
            args: "--target x86_64-unknown-linux-gnu --bundles appimage"
          - platform: "windows-latest" # Windows - NSIS for installed copies + portable zip for USB in-place updates
            target: "x86_64-pc-windows-msvc"
            arch: "x86_64"
            args: "--target x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ${{ matrix.platform == 'ubuntu-22.04' && '-C link-arg=-fuse-ld=lld' || '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/linux-deps
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf lld pkg-config

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"

      - name: install frontend dependencies
        run: npm ci

      - name: setup python for sidecar
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Restore sidecar bundle
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: sidecar/dist/euclide-sidecar
          key: sidecar-${{ matrix.platform }}-py3.12-${{ hashFiles('sidecar/requirements.txt', 'sidecar/euclide_sidecar/**', 'sidecar/run_sidecar.py', 'sidecar/build.py', 'sidecar/build_sidecar.sh', 'sidecar/build_sidecar.ps1') }}

      - name: build sidecar binary (non-Windows)
        if: matrix.platform != 'windows-latest' && steps.sidecar-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x sidecar/build_sidecar.sh
          sidecar/build_sidecar.sh

      - name: build sidecar binary (Windows)
        if: matrix.platform == 'windows-latest' && steps.sidecar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\sidecar\build_sidecar.ps1

      # What freezing can break (Jedi's data, accents, input(), the shims…).
      - name: smoke-test the frozen sidecar
        shell: bash
        run: |
          bin=sidecar/dist/euclide-sidecar/euclide-sidecar
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          python sidecar/smoke_frozen.py "$bin"

      - name: copy sidecar binary into tauri resources
        run: |
          mkdir -p src-tauri/resources
          # Remove any legacy flat sidecar or conflicting name first (can't have file and dir of same name)
          rm -rf src-tauri/resources/euclide-sidecar src-tauri/resources/euclide-sidecar.exe 2>/dev/null || true
          # Copy the onedir bundle (euclide-sidecar/ dir containing the launcher + support files).
          # This layout gives much faster startup than --onefile (no repeated temp extraction).
          cp -rf sidecar/dist/euclide-sidecar src-tauri/resources/
          # Ensure the launcher inside the onedir bundle is executable (important on macOS/Linux after bundle copy)
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x src-tauri/resources/euclide-sidecar/euclide-sidecar 2>/dev/null || true
          fi

          # Fail fast with debug info if the sidecar bundle wasn't copied (prevents cryptic "glob pattern resources/*" error later)
          if [ ! -d "src-tauri/resources/euclide-sidecar" ]; then
            echo "::error::Sidecar onedir bundle not found at src-tauri/resources/euclide-sidecar after copy step."
            echo "Contents of sidecar/dist/:"
            ls -la sidecar/dist/ || true
            echo "Contents of src-tauri/resources/:"
            ls -la src-tauri/resources/ || true
            exit 1
          fi
        shell: bash

      - name: Release metadata
        id: rel
        shell: bash
        run: |
          echo "tag=${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Require updater signing key
        if: steps.rel.outputs.upload == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Generate keys with \`npx tauri signer generate\`, put the public key in src-tauri/tauri.conf.json (plugins.updater.pubkey), and add the private key as a GitHub Actions secret. See README."
            exit 1
          fi

      # Official Tauri publish path: build, sign updater artifacts, merge latest.json across the matrix.
      # Sidecar must already be in src-tauri/resources (steps above). Uploads go
      # to the version job's draft; latest.json links assets by id, which
      # publishing keeps.
      - uses: tauri-apps/tauri-action@v1
        if: steps.rel.outputs.upload == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.version.outputs.release_id }}
          # The notes of latest.json.
          releaseBody: |
            Installateurs et archives USB portables.

            L’application vérifie `latest.json` sur GitHub Releases. Windows portable met à jour `Euclide-windows-portable.zip` **dans le dossier courant** (Euclide-Data intact). Les copies NSIS utilisent l’installateur.
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 3

      - name: Build without publishing
        if: steps.rel.outputs.upload != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.args }} --config src-tauri/tauri.usb.conf.json

      - name: Patch AppImage WebKit/Wayland runtime
        id: appimage_wayland
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x scripts/appimage-unbundle-wayland.sh
          scripts/appimage-unbundle-wayland.sh \
            "src-tauri/target/${{ matrix.target }}/release/bundle/appimage" \
            "src-tauri/target/release/bundle/appimage"

      - name: Replace Linux AppImage on the GitHub release
        if: runner.os == 'Linux' && steps.rel.outputs.upload == 'true' && steps.appimage_wayland.outputs.repacked == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            src-tauri/target/release/bundle/appimage/*.AppImage*
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No AppImage artifacts to upload."
            exit 0
          fi
          gh release upload "${{ steps.rel.outputs.tag }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
        shell: bash

      # Post-build: USB-friendly extras (zips / renamed AppImage). Linux AppImage
      # has already had the GTK hook patched and bundled libwayland stripped.
      - name: Package portable/standard apps
        run: |
          mkdir -p dist-portable
          if [ "${{ runner.os }}" = "macOS" ]; then
            # macOS (Apple Silicon / aarch64 only): zip the .app bundle (standard portable app)
            BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
            if [ -d "$BUNDLE_DIR" ]; then
              cd "$BUNDLE_DIR"
              # From macos/ inside target/<triple>/release/bundle/macos :
              # 6 levels up reaches repo root where dist-portable lives
              zip -r -y ../../../../../../dist-portable/Euclide-macos-${{ matrix.arch }}-portable.zip Euclide.app
              cd -
            else
              echo "Warning: macOS bundle dir not found at $BUNDLE_DIR"
            fi
          elif [ "${{ runner.os }}" = "Linux" ]; then
            # Linux: the AppImage is already the standard portable app (single file)
            APPIMAGE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/appimage"
            if [ ! -d "$APPIMAGE_DIR" ]; then
              # Fallback if --target not used in build (native build puts it directly under target/release)
              APPIMAGE_DIR="src-tauri/target/release/bundle/appimage"
            fi
            if [ -d "$APPIMAGE_DIR" ]; then
              cp "$APPIMAGE_DIR"/*.AppImage dist-portable/Euclide-linux-portable.AppImage 2>/dev/null || true
            else
              echo "Warning: Linux appimage dir not found at $APPIMAGE_DIR or fallback"
            fi
          else
            # Windows: create portable zip with exe + sidecar/ onedir bundle (no installer)
            mkdir -p Euclide-portable
            cp "src-tauri/target/${{ matrix.target }}/release/euclide.exe" Euclide-portable/ 2>/dev/null || cp "src-tauri/target/${{ matrix.target }}/release/Euclide.exe" Euclide-portable/ 2>/dev/null || cp "src-tauri/target/release/euclide.exe" Euclide-portable/ 2>/dev/null || true
            # Copy the whole onedir folder (euclide-sidecar/ with .exe + support files for fast startup, no console)
            cp -r sidecar/dist/euclide-sidecar Euclide-portable/ 2>/dev/null || cp -r src-tauri/resources/euclide-sidecar Euclide-portable/ 2>/dev/null || true
            : > Euclide-portable/euclide.portable
            echo "Portable Euclide for Windows. Extract the folder and run euclide.exe (or Euclide.exe)." > Euclide-portable/README.txt
            echo "Keep euclide.exe and the euclide-sidecar/ folder together. Do not delete the sidecar." >> Euclide-portable/README.txt
            echo "Data folder (Euclide-Data) is created next to the exe (USB / flash drive)." >> Euclide-portable/README.txt
            echo "In-app updates overlay new program files in THIS folder only. Euclide-Data and other files are never deleted." >> Euclide-portable/README.txt
            # 7-Zip (on the runner) does in seconds what Compress-Archive took
            # two minutes for. Deflate, as every Euclide since 0.1 unpacks it.
            7z a -tzip -mm=Deflate -mx=5 dist-portable/Euclide-windows-portable.zip "./Euclide-portable/*" >/dev/null
            # The updater wants euclide.exe and euclide-sidecar/ at the root.
            7z l -ba dist-portable/Euclide-windows-portable.zip | tr -d '\r' > zip-list.txt
            grep -Eq '[[:space:]]euclide\.exe$' zip-list.txt
            grep -Eq '[[:space:]]euclide-sidecar[\\/]euclide-sidecar\.exe$' zip-list.txt
            rm zip-list.txt
          fi
        shell: bash

      - name: Upload portable extras to the GitHub release
        if: steps.rel.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist-portable/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No portable files to upload."
            exit 0
          fi
          gh release upload "${{ steps.rel.outputs.tag }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
        shell: bash

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.arch }}-${{ matrix.platform }}
          path: dist-portable/*
          if-no-files-found: warn
          retention-days: 7

  # After every matrix leg has merged latest.json, point windows-x86_64 at the
  # signed USB zip. Keep the NSIS installer under windows-x86_64-nsis so installed
  # copies still update via the plugin. Must run last so tauri-action cannot overwrite it.
  # Then, and only then, the draft goes public. A failed leg leaves it a
  # draft: re-run the failed jobs.
  windows-portable-manifest:
    name: Point Windows updater at portable zip
    needs: [should-publish, version, publish-tauri]
    runs-on: ubuntu-latest
    if: needs.should-publish.outputs.run == 'true' && needs.version.outputs.tag != ''
    steps:
      # For CHANGELOG.md: the version's section becomes the release's notes,
      # and the ones Euclide shows before installing it (latest.json).
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Sign Euclide-windows-portable.zip and rewrite latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set."
            exit 1
          fi
          mkdir -p /tmp/euclide-updater
          # A release without its section keeps the notes it has.
          if ! node scripts/changelog/release-notes.mjs "${TAG#v}" > /tmp/euclide-updater/release-notes.md; then
            echo "::warning::CHANGELOG.md has no section for ${TAG#v}: the notes stay as they are."
            rm -f /tmp/euclide-updater/release-notes.md
          fi
          cd /tmp/euclide-updater
          gh release download "$TAG" --pattern 'Euclide-windows-portable.zip' --repo "$REPO"
          gh release download "$TAG" --pattern 'latest.json' --repo "$REPO"
          gh release download "$TAG" --pattern '*_amd64.AppImage.sig' --repo "$REPO" || true
          test -f Euclide-windows-portable.zip
          test -f latest.json
          npx --yes @tauri-apps/cli@2 signer sign Euclide-windows-portable.zip
          python3 <<'PY'
          import json, os, pathlib, re
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          sig = pathlib.Path("Euclide-windows-portable.zip.sig").read_text().strip()
          if not sig:
              raise SystemExit("empty signature file")
          data = json.loads(pathlib.Path("latest.json").read_text())
          platforms = data.setdefault("platforms", {})
          win = platforms.get("windows-x86_64") or {}
          url = str(win.get("url") or "")
          if "windows-x86_64-nsis" not in platforms and "portable" not in url.lower():
              platforms["windows-x86_64-nsis"] = win
          portable_url = f"https://github.com/{repo}/releases/download/{tag}/Euclide-windows-portable.zip"
          platforms["windows-x86_64"] = {"signature": sig, "url": portable_url}
          # The AppImage is patched and uploaded again after tauri-action listed
          # it: a new asset (the listed one is gone) and a new signature. Point
          # the Linux entries at it by name, with its own signature.
          linux_sigs = sorted(pathlib.Path(".").glob("*_amd64.AppImage.sig"))
          if linux_sigs:
              linux_sig = linux_sigs[0].read_text().strip()
              image = linux_sigs[0].name[: -len(".sig")]
              if linux_sig:
                  entry = {"signature": linux_sig, "url": f"https://github.com/{repo}/releases/download/{tag}/{image}"}
                  for key in ("linux-x86_64", "linux-x86_64-appimage"):
                      if key in platforms:
                          platforms[key] = dict(entry)
                  print("linux-x86_64 ->", entry["url"])
          # Euclide shows the notes as plain text before installing: the
          # section without its title, images, Markdown marks or install note.
          notes = pathlib.Path("release-notes.md")
          if notes.exists():
              section = notes.read_text().split("\n---\n", 1)[0]
              kept = []
              for line in section.splitlines():
                  if line.startswith("## ") or line.lstrip().startswith(("![", "<p>", "</p>", "<img")):
                      continue
                  kept.append(re.sub(r"^#+ ", "", line).replace("**", ""))
              data["notes"] = re.sub(r"\n{3,}", "\n\n", "\n".join(kept)).strip()
          # What every copy needs before the release goes public.
          if data.get("version") != tag.removeprefix("v"):
              raise SystemExit(f"latest.json is for {data.get('version')}, not {tag}")
          for key in ("windows-x86_64", "windows-x86_64-nsis", "linux-x86_64", "darwin-aarch64"):
              entry = platforms.get(key) or {}
              if not entry.get("url") or not entry.get("signature"):
                  raise SystemExit(f"latest.json has no {key} entry")
          pathlib.Path("latest.json").write_text(json.dumps(data, indent=2) + "\n")
          print("windows-x86_64 ->", portable_url)
          print("windows-x86_64-nsis ->", (platforms.get("windows-x86_64-nsis") or {}).get("url"))
          PY
          gh release upload "$TAG" latest.json --clobber --repo "$REPO"
          if [ -f release-notes.md ]; then
            gh release edit "$TAG" --notes-file release-notes.md --repo "$REPO"
          fi
          gh release edit "$TAG" --draft=false --repo "$REPO"
          echo "Published $TAG"
