name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-13' # Intel Macs (x86_64) - standard .app (no dmg setup)
            args: '--target x86_64-apple-darwin --bundles app'
          - platform: 'macos-latest' # Apple Silicon (aarch64) - standard .app (no dmg setup)
            args: '--target aarch64-apple-darwin --bundles app'
          - platform: 'ubuntu-22.04' # Linux - portable AppImage (no deb/rpm setups)
            args: '--bundles appimage'
          - platform: 'windows-latest' # Windows - portable (no installer setups, see post-build zip)
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            python3-dev python3-pip build-essential pkg-config

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install frontend dependencies
        run: npm ci

      - name: setup python for sidecar
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: build sidecar binary (non-Windows)
        if: matrix.platform != 'windows-latest'
        run: |
          chmod +x sidecar/build_sidecar.sh
          sidecar/build_sidecar.sh

      - name: build sidecar binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          .\sidecar\build_sidecar.ps1

      - name: copy sidecar binary into tauri resources
        run: |
          mkdir -p src-tauri/resources
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp -f sidecar/dist/euclide-sidecar.exe src-tauri/resources/ 2>/dev/null || true
          else
            cp -f sidecar/dist/euclide-sidecar src-tauri/resources/ 2>/dev/null || true
          fi
          # Remove the .py source from the bundle (binary takes precedence at runtime; .py stays in git for dev)
          rm -f src-tauri/resources/euclide_sidecar.py || true
        shell: bash

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ (matrix.platform == 'macos-latest' || matrix.platform == 'macos-13') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Euclide v__VERSION__'
          releaseBody: 'Download the standard portable app for your platform below (no installers/setups). Extract or mount and run directly. Fully portable - ideal for USB drive. See the assets below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Post-build: create portable/standard app packages (zips for easy download, no "setup" installers)
      # These are the "standard apps" that are portable (run from any folder/USB without installation).
      - name: Package portable/standard apps
        run: |
          mkdir -p dist-portable
          if [ "${{ runner.os }}" = "macOS" ]; then
            # macOS: zip the .app bundle (standard portable app)
            cd src-tauri/target/release/bundle/macos
            ARCH=$([ "${{ matrix.platform }}" = "macos-13" ] && echo "x86_64" || echo "aarch64")
            zip -r -y ../../../dist-portable/Euclide-macos-${ARCH}-portable.zip Euclide.app
            cd -
          elif [ "${{ runner.os }}" = "Linux" ]; then
            # Linux: the AppImage is already the standard portable app (single file)
            cp src-tauri/target/release/bundle/appimage/*.AppImage dist-portable/Euclide-linux-portable.AppImage 2>/dev/null || true
          else
            # Windows: create portable zip with exe + sidecar (no installer)
            mkdir -p Euclide-portable
            cp target/release/euclide.exe Euclide-portable/ 2>/dev/null || cp target/release/Euclide.exe Euclide-portable/ 2>/dev/null || true
            cp sidecar/dist/euclide-sidecar.exe Euclide-portable/ 2>/dev/null || cp src-tauri/resources/euclide-sidecar.exe Euclide-portable/ 2>/dev/null || true
            echo "Portable Euclide for Windows. Extract the folder and run euclide.exe (or Euclide.exe)." > Euclide-portable/README.txt
            echo "Data folder (Euclide-Data) will be created next to the exe for full portability on USB." >> Euclide-portable/README.txt
            powershell -Command "Compress-Archive -Path 'Euclide-portable/*' -DestinationPath 'dist-portable/Euclide-windows-portable.zip' -Force"
          fi
        shell: bash

      - name: Upload portable artifacts to release (for tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for f in dist-portable/*; do
            [ -f "$f" ] && gh release upload ${{ github.ref_name }} "$f" --repo ${{ github.repository }} --clobber || true
          done
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}