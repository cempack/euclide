name: 'publish'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create/update a GitHub release. Version tags (v*) and merges into main (when app/packaging source changed) publish a real Latest release. Main and manual runs replace the release tagged dev-build.'
        required: false
        default: true
        type: boolean

# tauri-action creates/updates the GitHub Release from the matrix (including latest.json).
permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Skip the matrix on main when the push is docs/CI-only. Tags and manual
  # runs always publish. Do not use workflow-level paths-ignore: that would
  # also filter v* tag pushes.
  should-publish:
    name: Should rebuild portables
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out() { echo "run=$1" >> "$GITHUB_OUTPUT"; echo "should-publish=$1"; }

          if [ "$EVENT_NAME" != "push" ] || [[ "$REF" == refs/tags/* ]]; then
            out true
            exit 0
          fi

          if [ -z "${BEFORE:-}" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            out true
            exit 0
          fi

          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE" || { out true; exit 0; }
          fi

          if ! changed="$(git diff --name-only "$BEFORE" "$SHA")"; then
            echo "git diff failed; publish to be safe."
            out true
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$changed"

          if [ -z "$changed" ]; then
            echo "No files changed; skip rebuild."
            out false
            exit 0
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/*|src-tauri/*|sidecar/*|scripts/*|public/*)
                echo "Code change: $f"
                out true
                exit 0
                ;;
              package.json|package-lock.json|index.html|vite.config.ts|tailwind.config.js|postcss.config.js|tsconfig.json|tsconfig.node.json)
                echo "Code change: $f"
                out true
                exit 0
                ;;
            esac
          done <<< "$changed"

          echo "No app/packaging source changes; skip rebuild."
          out false

  # Workflow/docs-only main pushes do not rebuild. Promote the existing
  # dev-build tag to a full Latest release if it is still a draft/prerelease.
  start-dev-build:
    name: Publish existing dev-build
    needs: should-publish
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.should-publish.outputs.run == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Mark the last main build as Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view dev-build --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "No dev-build release yet."
            exit 0
          fi
          gh release edit dev-build --draft=false --prerelease=false --latest --repo "${{ github.repository }}"
          echo "dev-build is a full Latest release."

  prepare-release:
    needs: should-publish
    if: needs.should-publish.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Drop previous dev-build release
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete dev-build --yes --repo "${{ github.repository }}" || true

  publish-tauri:
    needs: [should-publish, prepare-release]
    if: needs.should-publish.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (aarch64) - standard .app (no dmg setup)
            target: 'aarch64-apple-darwin'
            arch: 'aarch64'
            args: '--target aarch64-apple-darwin --bundles app'
          - platform: 'ubuntu-22.04' # Linux - portable AppImage (no deb/rpm setups)
            target: 'x86_64-unknown-linux-gnu'
            arch: 'x86_64'
            args: '--target x86_64-unknown-linux-gnu --bundles appimage'
          - platform: 'windows-latest' # Windows - NSIS for installed copies + portable zip for USB in-place updates
            target: 'x86_64-pc-windows-msvc'
            arch: 'x86_64'
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ${{ matrix.platform == 'ubuntu-22.04' && '-C link-arg=-fuse-ld=lld' || '' }}

    steps:
      - uses: actions/checkout@v6

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf lld pkg-config

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install frontend dependencies
        run: npm ci

      - name: setup python for sidecar
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Restore sidecar bundle
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: sidecar/dist/euclide-sidecar
          key: sidecar-${{ matrix.platform }}-py3.12-${{ hashFiles('sidecar/requirements.txt', 'src-tauri/resources/euclide_sidecar.py', 'sidecar/build_sidecar.sh', 'sidecar/build_sidecar.ps1') }}

      - name: build sidecar binary (non-Windows)
        if: matrix.platform != 'windows-latest' && steps.sidecar-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x sidecar/build_sidecar.sh
          sidecar/build_sidecar.sh

      - name: build sidecar binary (Windows)
        if: matrix.platform == 'windows-latest' && steps.sidecar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\sidecar\build_sidecar.ps1

      - name: copy sidecar binary into tauri resources
        run: |
          mkdir -p src-tauri/resources
          # Remove any legacy flat sidecar or conflicting name first (can't have file and dir of same name)
          rm -rf src-tauri/resources/euclide-sidecar src-tauri/resources/euclide-sidecar.exe 2>/dev/null || true
          # Copy the onedir bundle (euclide-sidecar/ dir containing the launcher + support files).
          # This layout gives much faster startup than --onefile (no repeated temp extraction).
          cp -rf sidecar/dist/euclide-sidecar src-tauri/resources/
          # Ensure the launcher inside the onedir bundle is executable (important on macOS/Linux after bundle copy)
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x src-tauri/resources/euclide-sidecar/euclide-sidecar 2>/dev/null || true
          fi
          # Remove the .py source from the bundle (binary takes precedence at runtime; .py stays in git for dev)
          rm -f src-tauri/resources/euclide_sidecar.py || true

          # Fail fast with debug info if the sidecar bundle wasn't copied (prevents cryptic "glob pattern resources/*" error later)
          if [ ! -d "src-tauri/resources/euclide-sidecar" ]; then
            echo "::error::Sidecar onedir bundle not found at src-tauri/resources/euclide-sidecar after copy step."
            echo "Contents of sidecar/dist/:"
            ls -la sidecar/dist/ || true
            echo "Contents of src-tauri/resources/:"
            ls -la src-tauri/resources/ || true
            exit 1
          fi
        shell: bash

      - name: Release metadata
        id: rel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=Euclide ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "upload=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=dev-build" >> "$GITHUB_OUTPUT"
            echo "name=Euclide main (${{ github.sha }})" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "upload=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.create_release }}" = "true" ]; then
            echo "tag=dev-build" >> "$GITHUB_OUTPUT"
            echo "name=Euclide dev-build (manual)" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require updater signing key
        if: steps.rel.outputs.upload == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Generate keys with \`npx tauri signer generate\`, put the public key in src-tauri/tauri.conf.json (plugins.updater.pubkey), and add the private key as a GitHub Actions secret. See README."
            exit 1
          fi

      # Official Tauri publish path: build, sign updater artifacts, merge latest.json across the matrix.
      # Sidecar must already be in src-tauri/resources (steps above). Do not delete the release between jobs.
      - uses: tauri-apps/tauri-action@v1
        if: steps.rel.outputs.upload == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.rel.outputs.tag }}
          releaseName: ${{ steps.rel.outputs.name }}
          releaseBody: |
            Installateurs et archives USB portables.

            L’application vérifie `latest.json` sur GitHub Releases. Windows portable met à jour `Euclide-windows-portable.zip` **dans le dossier courant** (Euclide-Data intact). Les copies NSIS utilisent l’installateur.
          releaseDraft: ${{ steps.rel.outputs.draft == 'true' }}
          prerelease: ${{ steps.rel.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 3

      - name: Build without publishing
        if: steps.rel.outputs.upload != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.args }} --config src-tauri/tauri.usb.conf.json

      - name: Patch AppImage WebKit/Wayland runtime
        id: appimage_wayland
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x scripts/appimage-unbundle-wayland.sh
          scripts/appimage-unbundle-wayland.sh \
            "src-tauri/target/${{ matrix.target }}/release/bundle/appimage" \
            "src-tauri/target/release/bundle/appimage"

      - name: Replace Linux AppImage on the GitHub release
        if: runner.os == 'Linux' && steps.rel.outputs.upload == 'true' && steps.appimage_wayland.outputs.repacked == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            src-tauri/target/release/bundle/appimage/*.AppImage*
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No AppImage artifacts to upload."
            exit 0
          fi
          gh release upload "${{ steps.rel.outputs.tag }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
        shell: bash

      # Post-build: USB-friendly extras (zips / renamed AppImage). Linux AppImage
      # has already had the GTK hook patched and bundled libwayland stripped.
      - name: Package portable/standard apps
        run: |
          mkdir -p dist-portable
          if [ "${{ runner.os }}" = "macOS" ]; then
            # macOS (Apple Silicon / aarch64 only): zip the .app bundle (standard portable app)
            BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
            if [ -d "$BUNDLE_DIR" ]; then
              cd "$BUNDLE_DIR"
              # From macos/ inside target/<triple>/release/bundle/macos :
              # 6 levels up reaches repo root where dist-portable lives
              zip -r -y ../../../../../../dist-portable/Euclide-macos-${{ matrix.arch }}-portable.zip Euclide.app
              cd -
            else
              echo "Warning: macOS bundle dir not found at $BUNDLE_DIR"
            fi
          elif [ "${{ runner.os }}" = "Linux" ]; then
            # Linux: the AppImage is already the standard portable app (single file)
            APPIMAGE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/appimage"
            if [ ! -d "$APPIMAGE_DIR" ]; then
              # Fallback if --target not used in build (native build puts it directly under target/release)
              APPIMAGE_DIR="src-tauri/target/release/bundle/appimage"
            fi
            if [ -d "$APPIMAGE_DIR" ]; then
              cp "$APPIMAGE_DIR"/*.AppImage dist-portable/Euclide-linux-portable.AppImage 2>/dev/null || true
            else
              echo "Warning: Linux appimage dir not found at $APPIMAGE_DIR or fallback"
            fi
          else
            # Windows: create portable zip with exe + sidecar/ onedir bundle (no installer)
            mkdir -p Euclide-portable
            cp "src-tauri/target/${{ matrix.target }}/release/euclide.exe" Euclide-portable/ 2>/dev/null || cp "src-tauri/target/${{ matrix.target }}/release/Euclide.exe" Euclide-portable/ 2>/dev/null || cp "src-tauri/target/release/euclide.exe" Euclide-portable/ 2>/dev/null || true
            # Copy the whole onedir folder (euclide-sidecar/ with .exe + support files for fast startup, no console)
            cp -r sidecar/dist/euclide-sidecar Euclide-portable/ 2>/dev/null || cp -r src-tauri/resources/euclide-sidecar Euclide-portable/ 2>/dev/null || true
            : > Euclide-portable/euclide.portable
            echo "Portable Euclide for Windows. Extract the folder and run euclide.exe (or Euclide.exe)." > Euclide-portable/README.txt
            echo "Keep euclide.exe and the euclide-sidecar/ folder together. Do not delete the sidecar." >> Euclide-portable/README.txt
            echo "Data folder (Euclide-Data) is created next to the exe (USB / flash drive)." >> Euclide-portable/README.txt
            echo "In-app updates overlay new program files in THIS folder only. Euclide-Data and other files are never deleted." >> Euclide-portable/README.txt
            powershell -Command "Compress-Archive -Path 'Euclide-portable/*' -DestinationPath 'dist-portable/Euclide-windows-portable.zip' -Force"
          fi
        shell: bash

      - name: Upload portable extras to the GitHub release
        if: steps.rel.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist-portable/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No portable files to upload."
            exit 0
          fi
          gh release upload "${{ steps.rel.outputs.tag }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
        shell: bash

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.arch }}-${{ matrix.platform }}
          path: dist-portable/*
          if-no-files-found: warn
          retention-days: 7

  # After every matrix leg has merged latest.json, point windows-x86_64 at the
  # signed USB zip. Keep the NSIS installer under windows-x86_64-nsis so installed
  # copies still update via the plugin. Must run last so tauri-action cannot overwrite it.
  windows-portable-manifest:
    name: Point Windows updater at portable zip
    needs: [should-publish, publish-tauri]
    runs-on: ubuntu-latest
    if: |
      needs.should-publish.outputs.run == 'true' && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
      )
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Sign Euclide-windows-portable.zip and rewrite latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'dev-build' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set."
            exit 1
          fi
          mkdir -p /tmp/euclide-updater
          cd /tmp/euclide-updater
          gh release download "$TAG" --pattern 'Euclide-windows-portable.zip' --repo "$REPO"
          gh release download "$TAG" --pattern 'latest.json' --repo "$REPO"
          gh release download "$TAG" --pattern '*amd64.AppImage.tar.gz.sig' --repo "$REPO" || true
          test -f Euclide-windows-portable.zip
          test -f latest.json
          npx --yes @tauri-apps/cli@2 signer sign Euclide-windows-portable.zip
          python3 <<'PY'
          import json, os, pathlib
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          sig = pathlib.Path("Euclide-windows-portable.zip.sig").read_text().strip()
          if not sig:
              raise SystemExit("empty signature file")
          data = json.loads(pathlib.Path("latest.json").read_text())
          platforms = data.setdefault("platforms", {})
          win = platforms.get("windows-x86_64") or {}
          url = str(win.get("url") or "")
          if "windows-x86_64-nsis" not in platforms and "portable" not in url.lower():
              platforms["windows-x86_64-nsis"] = win
          portable_url = f"https://github.com/{repo}/releases/download/{tag}/Euclide-windows-portable.zip"
          platforms["windows-x86_64"] = {"signature": sig, "url": portable_url}
          linux_sigs = sorted(pathlib.Path(".").glob("*amd64.AppImage.tar.gz.sig"))
          if linux_sigs:
              linux_sig = linux_sigs[0].read_text().strip()
              if linux_sig:
                  linux = platforms.get("linux-x86_64") or {}
                  linux["signature"] = linux_sig
                  platforms["linux-x86_64"] = linux
                  print("linux-x86_64 signature refreshed from", linux_sigs[0].name)
          pathlib.Path("latest.json").write_text(json.dumps(data, indent=2) + "\n")
          print("windows-x86_64 ->", portable_url)
          print("windows-x86_64-nsis ->", (platforms.get("windows-x86_64-nsis") or {}).get("url"))
          PY
          gh release upload "$TAG" latest.json --clobber --repo "$REPO"
