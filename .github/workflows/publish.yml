name: 'publish'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create/update a draft release (tagged dev-build) so you can easily download the portable files from the Releases page. Replaces previous dev-build each time.'
        required: false
        default: true
        type: boolean

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (aarch64) - standard .app (no dmg setup)
            target: 'aarch64-apple-darwin'
            arch: 'aarch64'
            args: '--target aarch64-apple-darwin --bundles app'
          - platform: 'ubuntu-22.04' # Linux - portable AppImage (no deb/rpm setups)
            target: 'x86_64-unknown-linux-gnu'
            arch: 'x86_64'
            args: '--bundles appimage'
          - platform: 'windows-latest' # Windows - portable (no installer setups, see post-build zip)
            target: 'x86_64-pc-windows-msvc'
            arch: 'x86_64'
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            python3-dev python3-pip build-essential pkg-config

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install frontend dependencies
        run: npm ci

      - name: setup python for sidecar
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: build sidecar binary (non-Windows)
        if: matrix.platform != 'windows-latest'
        run: |
          chmod +x sidecar/build_sidecar.sh
          sidecar/build_sidecar.sh

      - name: build sidecar binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          .\sidecar\build_sidecar.ps1

      - name: copy sidecar binary into tauri resources
        run: |
          mkdir -p src-tauri/resources
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp -f sidecar/dist/euclide-sidecar.exe src-tauri/resources/ 2>/dev/null || true
          else
            cp -f sidecar/dist/euclide-sidecar src-tauri/resources/ 2>/dev/null || true
          fi
          # Remove the .py source from the bundle (binary takes precedence at runtime; .py stays in git for dev)
          rm -f src-tauri/resources/euclide_sidecar.py || true
        shell: bash

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # Build manually so we can control bundling (no setups on Windows, only portable/standard apps)
      - name: Build Tauri application
        run: npx tauri build ${{ matrix.args }}

      # Post-build: create portable/standard app packages (zips for easy download, no "setup" installers)
      # These are the "standard apps" that are portable (run from any folder/USB without installation).
      # Only Apple Silicon macOS is built (remove non-ARM macOS).
      - name: Package portable/standard apps
        run: |
          mkdir -p dist-portable
          if [ "${{ runner.os }}" = "macOS" ]; then
            # macOS (Apple Silicon / aarch64 only): zip the .app bundle (standard portable app)
            BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
            if [ -d "$BUNDLE_DIR" ]; then
              cd "$BUNDLE_DIR"
              # From macos/ inside target/<triple>/release/bundle/macos :
              # 6 levels up reaches repo root where dist-portable lives
              zip -r -y ../../../../../../dist-portable/Euclide-macos-${{ matrix.arch }}-portable.zip Euclide.app
              cd -
            else
              echo "Warning: macOS bundle dir not found at $BUNDLE_DIR"
            fi
          elif [ "${{ runner.os }}" = "Linux" ]; then
            # Linux: the AppImage is already the standard portable app (single file)
            APPIMAGE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/appimage"
            if [ -d "$APPIMAGE_DIR" ]; then
              cp "$APPIMAGE_DIR"/*.AppImage dist-portable/Euclide-linux-portable.AppImage 2>/dev/null || true
            else
              echo "Warning: Linux appimage dir not found at $APPIMAGE_DIR"
            fi
          else
            # Windows: create portable zip with exe + sidecar (no installer)
            mkdir -p Euclide-portable
            cp "src-tauri/target/${{ matrix.target }}/release/euclide.exe" Euclide-portable/ 2>/dev/null || cp "src-tauri/target/${{ matrix.target }}/release/Euclide.exe" Euclide-portable/ 2>/dev/null || cp "src-tauri/target/release/euclide.exe" Euclide-portable/ 2>/dev/null || cp "src-tauri/target/release/Euclide.exe" Euclide-portable/ 2>/dev/null || true
            cp sidecar/dist/euclide-sidecar.exe Euclide-portable/ 2>/dev/null || cp src-tauri/resources/euclide-sidecar.exe Euclide-portable/ 2>/dev/null || true
            echo "Portable Euclide for Windows. Extract the folder and run euclide.exe (or Euclide.exe)." > Euclide-portable/README.txt
            echo "Data folder (Euclide-Data) will be created next to the exe for full portability on USB." >> Euclide-portable/README.txt
            powershell -Command "Compress-Archive -Path 'Euclide-portable/*' -DestinationPath 'dist-portable/Euclide-windows-portable.zip' -Force"
          fi
        shell: bash

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.arch }}-${{ matrix.platform }}
          path: dist-portable/*
          if-no-files-found: warn
          retention-days: 7

  release:
    # Create the GitHub Release (with all platform portable artifacts attached) on:
    # - Real version tag pushes (v*)
    # - Manual "Run workflow" when create_release input is true (uses a "dev-build" tag that gets replaced each time)
    # This ensures the release step never skips when you want the files, and you get them in the Releases page.
    if: |
      always() &&
      ( (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release) ) &&
      (needs.publish-tauri.result == 'success' || needs.publish-tauri.result == 'failure')
    needs: publish-tauri
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all portable artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: dist-portable
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist-portable/ || true

      - name: Determine release tag
        run: |
          if [ "${{ github.event_name }}" = "push" ] && echo "${{ github.ref }}" | grep -q '^refs/tags/'; then
            RELEASE_TAG="${{ github.ref_name }}"
            RELEASE_NAME="${{ github.ref_name }}"
            echo "Real tag push: will create/update release for $RELEASE_TAG"
          else
            RELEASE_TAG="dev-build"
            RELEASE_NAME="dev-build (manual)"
            echo "Manual/dispatch run: will create/update dev-build release (replaces previous)"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

      - name: Delete existing release (if any) for this tag to allow replace/re-release with same tag
        run: |
          gh release delete "$RELEASE_TAG" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload portable artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 'Euclide ${{ env.RELEASE_NAME }}'
          body: 'Download the standard portable app for your platform below (no installers/setups). All builds are fully portable (USB-friendly). For manual runs this is the "dev-build" tag (replaced each time).'
          draft: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          overwrite_files: true
          files: dist-portable/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}