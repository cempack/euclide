name: "preview"

# Test builds of any branch, for trying a change on a school PC before it
# reaches main. Run it by hand from the Actions tab and pick the branch.
# Artifacts only: never tags, never touches GitHub releases or latest.json.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc --no-bundle"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: "--target x86_64-unknown-linux-gnu --bundles appimage"

    runs-on: ${{ matrix.platform }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ${{ matrix.platform == 'ubuntu-22.04' && '-C link-arg=-fuse-ld=lld' || '' }}

    steps:
      - uses: actions/checkout@v6

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf lld pkg-config

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"

      - run: npm ci

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: preview-${{ matrix.target }}
          cache-on-failure: true

      - name: Restore sidecar bundle
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: sidecar/dist/euclide-sidecar
          key: sidecar-${{ matrix.platform }}-py3.12-${{ hashFiles('sidecar/requirements.txt', 'sidecar/euclide_sidecar/**', 'sidecar/run_sidecar.py', 'sidecar/build.py', 'sidecar/build_sidecar.sh', 'sidecar/build_sidecar.ps1') }}

      - name: build sidecar (Linux)
        if: runner.os == 'Linux' && steps.sidecar-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x sidecar/build_sidecar.sh
          sidecar/build_sidecar.sh

      - name: build sidecar (Windows)
        if: runner.os == 'Windows' && steps.sidecar-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\sidecar\build_sidecar.ps1

      # What freezing can break (Jedi's data, accents, input(), the shims…).
      - name: smoke-test the frozen sidecar
        shell: bash
        run: |
          bin=sidecar/dist/euclide-sidecar/euclide-sidecar
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          python sidecar/smoke_frozen.py "$bin"

      - name: copy sidecar into tauri resources
        shell: bash
        run: |
          rm -rf src-tauri/resources/euclide-sidecar src-tauri/resources/euclide-sidecar.exe
          cp -rf sidecar/dist/euclide-sidecar src-tauri/resources/
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x src-tauri/resources/euclide-sidecar/euclide-sidecar 2>/dev/null || true
          fi

      # The USB config turns updater artifacts off, so no signing key is needed.
      - name: build
        run: npx tauri build ${{ matrix.args }} --config src-tauri/tauri.usb.conf.json

      - name: patch AppImage WebKit/Wayland runtime
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/appimage-unbundle-wayland.sh
          scripts/appimage-unbundle-wayland.sh \
            "src-tauri/target/${{ matrix.target }}/release/bundle/appimage"

      - name: package
        shell: bash
        run: |
          mkdir -p preview
          if [ "${{ runner.os }}" = "Windows" ]; then
            mkdir -p Euclide-portable
            cp "src-tauri/target/${{ matrix.target }}/release/euclide.exe" Euclide-portable/
            cp -r sidecar/dist/euclide-sidecar Euclide-portable/
            : > Euclide-portable/euclide.portable
            echo "Build de test Euclide (${GITHUB_REF_NAME}@${GITHUB_SHA::7}). Ne pas utiliser sur la clé de production sans sauvegarde." > Euclide-portable/LISEZMOI.txt
            7z a -tzip -mm=Deflate -mx=5 preview/Euclide-windows-preview.zip "./Euclide-portable/*" >/dev/null
          else
            cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage preview/Euclide-linux-preview.AppImage
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: euclide-preview-${{ runner.os }}
          path: preview/*
          if-no-files-found: error
          retention-days: 14
