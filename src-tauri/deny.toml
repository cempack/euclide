# cargo deny check — dependencies' advisories, licences and sources.
# Run from src-tauri/: `cargo deny check`.

[graph]
all-features = false

[advisories]
ignore = [
    # proc-macro-error (unmaintained): a build-time macro of glib-macros 0.18,
    # the GTK 3 bindings Tauri needs on Linux. No newer gtk-rs for GTK 3.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, via gtk-rs 0.18 (Tauri on Linux); no upgrade exists" },
]

[licenses]
# Permissive licences, plus MPL-2.0 (file-level copyleft: dependencies used
# unmodified) and CDLA-Permissive-2.0 (the root certificates' data).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Euclide itself (publish = false) is not a dependency.
private = { ignore = true }

[bans]
# Tauri's tree carries several versions of some crates; not an error.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
