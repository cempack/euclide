[package]
name = "euclide"
version = "0.1.2"
description = "Euclide - le bureau d'enseignement pour un professeur de mathématiques et NSI"
authors = ["Elliot Moreau"]
edition = "2021"

[lib]
name = "euclide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
keepawake = "0.6"
tokio = { version = "1", features = ["process", "io-util", "sync"] }
tauri-plugin-process = "2.3.1"
# deflate-flate2 alone leaves flate2 with no compression backend. On Windows,
# reqwest also depends on flate2 with default-features = false, so the unified
# graph has no rust_backend/zlib-rs and MSVC CI dies with
# "You need to choose a zlib backend". zlib-rs is pure Rust (no system zlib).
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
minisign-verify = "0.2"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.11.0"
