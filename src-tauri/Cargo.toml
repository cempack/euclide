[package]
name = "euclide"
version = "0.3.0"
description = "Euclide - le bureau d'enseignement pour un professeur de mathématiques et NSI"
authors = ["Elliot Moreau"]
edition = "2021"

[lib]
name = "euclide_lib"
# Desktop only: the binary links this crate; no mobile static/dynamic libs.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
keepawake = "0.6"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
# deflate-flate2 alone leaves flate2 with no compression backend. On Windows,
# reqwest also depends on flate2 with default-features = false, so the unified
# graph has no rust_backend/zlib-rs and MSVC CI dies with
# "You need to choose a zlib backend". zlib-rs is pure Rust (no system zlib).
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
minisign-verify = "0.2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# DPAPI, to keep Pronote passwords encrypted for the Windows user (already in the tree via Tauri).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
# WebView2's PrintToPdf (note export, print.rs): the versions wry uses.
webview2-com = "0.39"
windows = "0.62"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# WebKitGTK's print operation (note export, print.rs): the versions wry uses.
webkit2gtk = "2.0"
gtk = "0.18"

[dev-dependencies]
chrono-tz = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.11.0"

[lints.clippy]
# App code reports errors (see error.rs) instead of panicking; tests may unwrap
# (clippy.toml).
unwrap_used = "warn"

# Dependencies optimized in dev builds too: debugging stays on our crate, but
# SQLite, image and zip code run at a realistic speed.
[profile.dev.package."*"]
opt-level = 2
