<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-small.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/logo-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Euclide</title>
    <!--
      Fonts are bundled (see @fontsource imports in src/main.tsx): Euclide runs
      offline, from a USB key, in classrooms without network. No CDN.
      Icons are local SVG + lucide-react.
    -->
    <script>
      // Apply the saved appearance before first paint so there is no flash.
      // The backend injects the saved settings at launch (src/lib/boot.ts);
      // after a reload of the page they are stale and the localStorage mirror
      // kept by lib/theme.tsx is used instead.
      (function () {
        var root = document.documentElement;
        var saved = {};
        var boot = window.__EUCLIDE_BOOT__;
        try {
          if (boot && boot.settings && sessionStorage.getItem("eu:boot") !== boot.nonce)
            saved = boot.settings;
        } catch (e) {
          if (boot && boot.settings) saved = boot.settings;
        }
        var local = function (key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        };
        var pref = saved.theme || local("eu:theme") || "auto";
        var dark =
          pref === "dark" ||
          (pref === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.setAttribute("data-density", saved.density || local("eu:density") || "comfortable");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
