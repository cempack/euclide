<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/euclide-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Euclide</title>
    <!--
      Fonts are bundled (see @fontsource imports in src/main.tsx): Euclide runs
      offline, from a USB key, in classrooms without network. No CDN.
      Icons are local SVG + lucide-react.
    -->
    <script>
      // Apply the saved appearance before first paint so there is no flash.
      // SQLite (via api.setSetting) stays the source of truth; this is a mirror.
      (function () {
        try {
          var pref = localStorage.getItem("eu:theme") || "auto";
          var dark =
            pref === "dark" ||
            (pref === "auto" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.setAttribute("data-theme", dark ? "dark" : "light");
          root.setAttribute("data-density", localStorage.getItem("eu:density") || "comfortable");
        } catch (e) {
          /* private mode / storage disabled: stay on the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
